<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EX YU DATE — Dobrodošli</title>
<style>
  html, body{
    margin:0;
    padding:0;
    height:100%;
    background:#1a0033;
    font-family:Arial,sans-serif;
    overflow:hidden;
  }
  h1{
    color:#fff;
    margin:0;
    position:fixed;
    top:20px;
    left:0;
    right:0;
    text-align:center;
    z-index:2;
    text-shadow:0 2px 8px rgba(0,0,0,0.6);
  }
  video{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    object-fit:cover;
  }
  .skip{
    display:block;
    position:fixed;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);
    color:#fff;
    background:#a23cff;
    border:none;
    padding:18px 40px;
    border-radius:30px;
    font-size:20px;
    font-weight:700;
    cursor:pointer;
    z-index:2;
    box-shadow:0 8px 24px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>

<h1>Dobrodošli na EX YU DATE!</h1>

<video id="welcomeVideo" controls autoplay playsinline src="media/registracija-video.mp4"></video>

<button type="button" class="skip" id="skipBtn">Nastavi na Početnu →</button>

<script>
document.getElementById('skipBtn').onclick = function(){
  window.location.href = 'pocetna.html';
};
</script>

</body>
</html>
