<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EX YU DATE — Dobrodošli</title>
<style>
  html, body{
    margin:0;
    padding:0;
    height:100%;
    background:#1a0033;
    font-family:Arial,sans-serif;
    overflow:hidden;
  }
  video{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    object-fit:cover;
  }
  /* zamagljena kopija iza videa - vidi se samo na uspravnom ekranu (mobitel) */
  #bgVideo{ display:none; }
  @media (max-aspect-ratio: 1/1){
    #welcomeVideo{ object-fit:contain; z-index:1; }
    #bgVideo{ display:block; object-fit:cover; filter:blur(18px) brightness(0.55); transform:scale(1.15); z-index:0; }
  }
  .skip{
    display:block;
    position:fixed;
    top:20px;
    right:20px;
    color:#fff;
    background:rgba(0,0,0,0.45);
    border:1px solid rgba(255,255,255,0.5);
    padding:8px 16px;
    border-radius:20px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    z-index:2;
  }
</style>
</head>
<body>
<video id="bgVideo" autoplay muted playsinline preload="auto" src="media/registracija-video.mp4" aria-hidden="true"></video>
<video id="welcomeVideo" autoplay playsinline preload="auto" src="media/registracija-video.mp4"></video>
<button type="button" class="skip" id="skipBtn">Preskoči</button>
<script>
document.getElementById('skipBtn').onclick = function(){
  window.location.href = 'upute.html';
};
// zamagljena pozadina prati glavni video
(function(){
  var v = document.getElementById('welcomeVideo'), b = document.getElementById('bgVideo');
  v.addEventListener('play', function(){ try{ b.currentTime = v.currentTime; b.play(); }catch(e){} });
  v.addEventListener('pause', function(){ b.pause(); });
  setInterval(function(){ if (Math.abs(b.currentTime - v.currentTime) > 0.3) { try{ b.currentTime = v.currentTime; }catch(e){} } }, 1000);
})();
document.getElementById('welcomeVideo').addEventListener('ended', function(){
  window.location.href = 'upute.html';
});
</script>
</body>
</html>
