<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EX YU DATE — Dobrodošli</title>
<style>
  html, body{
    margin:0;
    padding:0;
    height:100%;
    background:#1a0033;
    font-family:Arial,sans-serif;
    overflow:hidden;
  }
  video{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    object-fit:cover;
  }
  .skip{
    display:block;
    position:fixed;
    top:20px;
    right:20px;
    color:#fff;
    background:rgba(0,0,0,0.45);
    border:1px solid rgba(255,255,255,0.5);
    padding:8px 16px;
    border-radius:20px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    z-index:2;
  }
</style>
</head>
<body>

<video id="welcomeVideo" autoplay muted playsinline src="media/registracija-video.mp4"></video>

<button type="button" class="skip" id="skipBtn">Preskoči</button>

<script>
document.getElementById('skipBtn').onclick = function(){
  window.location.href = 'pocetna.html';
};
document.getElementById('welcomeVideo').addEventListener('ended', function(){
  window.location.href = 'pocetna.html';
});
</script>

</body>
</html>
