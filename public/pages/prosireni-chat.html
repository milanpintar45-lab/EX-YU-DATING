<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EX YU DATE — Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1a0033;--purple-900:#2d0057;--purple-800:#4a0a7a;--purple-700:#6b1a9e;
  --purple-600:#7b2cbf;--purple-500:#a23cff;--purple-300:#c57dff;--purple-100:#e9c6ff;
  --pink:#ff6b9d;--text:#e9c6ff;--muted:#b8a4d4;--line:rgba(162,60,255,0.45);
  --panel:rgba(45,0,87,0.4);--msg-own:rgba(162,60,255,0.25);--msg-other:rgba(255,255,255,0.06);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#1a0033 0%,#2d0057 50%,#4a0a7a 100%);color:var(--text);min-height:100vh;padding:18px;}
a{color:inherit;text-decoration:none;cursor:pointer;}
.app{min-height:calc(100vh - 36px);border:1px solid rgba(162,60,255,0.25);border-radius:14px;overflow:hidden;background:rgba(0,0,0,0.15);display:flex;flex-direction:column;}
.top{display:grid;grid-template-columns:160px 1fr 220px;padding:18px 22px;gap:16px;align-items:start;}
.corner-links{display:flex;flex-direction:column;gap:6px;font-size:13px;}
.corner-links a{color:var(--purple-300);font-size:15px;}
.corner-links a:hover{color:#fff;}
.title-wrap{text-align:center;}
.title{font-family:'Poppins',sans-serif;font-size:44px;font-weight:700;letter-spacing:6px;background:linear-gradient(180deg,#fff 0%,var(--purple-100) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;}
.title-sub{font-size:11px;color:var(--muted);letter-spacing:3px;margin-top:2px;}
.right-of-title{display:flex;flex-direction:column;gap:8px;align-items:flex-end;font-size:13px;}
.right-of-title a{color:var(--purple-300);font-size:15px;}
.nav-bar{display:flex;align-items:stretch;border-bottom:2px solid rgba(255,45,149,0.5);}
.nav-bar a{display:inline-block;padding:14px 22px;font-weight:700;letter-spacing:1.5px;color:var(--muted);border-right:1px solid rgba(255,45,149,0.35);transition:all .2s;text-transform:uppercase;font-size:14px;cursor:pointer;}
.nav-bar a:hover{color:#fff;background:rgba(255,45,149,0.16);}
.nav-bar a.active{color:#fff;background:linear-gradient(180deg,#ff2d78,#c4145a);box-shadow:inset 0 -3px 0 #ffb3d9;text-shadow:0 0 12px rgba(255,92,173,0.85);}
.nav-bar .spacer{flex:1;}
.filter-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 22px;border-bottom:1px solid rgba(162,60,255,0.25);background:rgba(0,0,0,0.1);}
.filter-bar .fb-group{display:flex;align-items:center;gap:6px;}
.filter-bar label{color:var(--muted);font-size:12px;letter-spacing:.5px;white-space:nowrap;}
.filter-bar select{background:rgba(255,255,255,0.06);border:1px solid rgba(162,60,255,0.4);border-radius:8px;padding:6px 10px;color:#fff;font-family:inherit;font-size:13px;outline:none;}
.filter-bar select:focus{border-color:#c57dff;}
.chat-wrap{flex:1;display:flex;flex-direction:column;padding:18px 22px;gap:10px;overflow-y:auto;}
.chat-card{background:rgba(255,255,255,0.04);border:1px solid rgba(162,60,255,0.35);border-radius:10px;padding:12px 14px;font-size:14px;}
.chat-card .who{color:#ffe27a;font-weight:700;font-size:15px;text-shadow:0 0 6px rgba(255,226,122,0.5);}
.chat-card .who span{color:var(--muted);font-weight:400;font-size:11px;}
.chat-card .msg{color:var(--text);margin-top:4px;line-height:1.5;}
.chat-card .time{color:var(--muted);font-size:11px;margin-top:4px;}
.chat-card.own{background:var(--msg-own);border-color:rgba(162,60,255,0.5);margin-left:40px;}
.chat-card.other{background:var(--msg-other);margin-right:40px;}
.chat-input-wrap{display:flex;gap:8px;padding:14px 22px;border-top:1px solid rgba(162,60,255,0.25);background:rgba(0,0,0,0.15);}
.chat-input-wrap input{flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(162,60,255,0.4);border-radius:8px;padding:10px 14px;color:#fff;font-family:inherit;font-size:14px;outline:none;}
.chat-input-wrap input::placeholder{color:var(--muted);}
.chat-input-wrap input:focus{border-color:#c57dff;}
.chat-input-wrap button{background:linear-gradient(180deg,var(--purple-500),var(--purple-600));color:#fff;border:none;border-radius:8px;padding:10px 20px;font-weight:700;letter-spacing:1px;cursor:pointer;font-family:inherit;font-size:14px;transition:all .2s;}
.chat-input-wrap button:hover{background:linear-gradient(180deg,var(--purple-600),var(--purple-700));box-shadow:0 0 14px rgba(199,155,255,0.4);}
.empty{text-align:center;color:var(--muted);font-style:italic;padding:30px 8px;font-size:13px;}
.footer-nav{padding:14px 22px;border-top:1px solid rgba(162,60,255,0.35);display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,0.22);}
.btn{background:linear-gradient(180deg,var(--purple-500),var(--purple-600));color:#fff;padding:10px 18px;border-radius:8px;font-weight:600;letter-spacing:1px;border:1px solid var(--purple-300);font-size:13px;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:8px;}
.btn:hover{background:linear-gradient(180deg,var(--purple-600),var(--purple-700));box-shadow:0 0 14px rgba(199,155,255,0.4);}
.current-filter{color:var(--muted);font-size:13px;letter-spacing:.5px;}
.current-filter b{color:var(--purple-100);}
@media(max-width:900px){
  .top{grid-template-columns:1fr;text-align:center;}
  .right-of-title{align-items:center;}
}
@media(max-width:600px){
  body{padding:8px;}
  .app{min-height:calc(100vh - 16px);border-radius:10px;}
  .top{grid-template-columns:1fr;text-align:center;gap:8px;padding:12px 14px;}
  .title{font-size:26px;letter-spacing:2px;}
  .nav-bar{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .nav-bar a{padding:10px 12px;font-size:11px;letter-spacing:1px;border-right:none;border-bottom:1px solid rgba(162,60,255,0.2);white-space:nowrap;flex-shrink:0;}
  .chat-wrap{padding:12px 14px;}
  .chat-card.own{margin-left:20px;}
  .chat-card.other{margin-right:20px;}
  .chat-input-wrap{padding:10px 14px;}
  .footer-nav{padding:10px 14px;}
}

</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="corner-links">
      <a href="../index.html">Odjava</a>
      <a href="pocetna.html">Početna</a>
      <a href="settings.html">⚙️ Postavke</a>
    </div>
    <div class="title-wrap">
      <div class="title" id="pageTitle">CHAT</div>
      <div class="title-sub" id="pageSub">Razgovori</div>
    </div>
    <div class="right-of-title" id="rightLinks"></div>
  </div>
  <nav class="nav-bar">
    <a href="na-mrezi.html" id="navOnline">NA MREŽI</a>
    <a href="#" class="active">CHAT</a>
    <a href="svi-korisnici.html" id="navUsers">SVI KORISNICI</a>
    <div class="spacer"></div>
  </nav>
  <div class="filter-bar">
    <div class="fb-group">
      <label>Županija/Grad</label>
      <select id="countyFilter"><option value="SVI">Svi</option></select>
    </div>
  </div>
  <div class="chat-wrap" id="chatWrap"></div>
  <div class="chat-input-wrap">
    <input type="text" id="chatInput" placeholder="Napiši poruku...">
    <button type="button" id="chatSendBtn">POŠALJI</button>
  </div>
  <div class="footer-nav">
    <a class="btn" id="backBtn" href="hrvatska.html">← Natrag</a>
    <div class="current-filter">Prikaz: <b id="currentFilter">—</b></div>
  </div>
</div>
<script>
const API_BASE = '/api';
async function api(method, path, body) {
  const opts = { method, headers: {}, credentials: 'include' };
  if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const res = await fetch(API_BASE + path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Greška.');
  return data;
}

var params=new URLSearchParams(window.location.search);
var COUNTRY=params.get('country')||'hr';
var COUNTY=params.get('county')||'SVI';
var countryNames={hr:'Hrvatska',ba:'Bosna i Hercegovina',rs:'Srbija'};
var countryPage={hr:'hrvatska.html',ba:'bosna.html',rs:'srbija.html'};

// Stvarne regije po državi (usklađeno s hrvatska/bosna/srbija.html - HR županije,
// BA kantoni, RS okruzi), ne više gradovi kao u ranijoj demo verziji.
var counties={
  hr:["Bjelovarsko-bilogorska","Brodsko-posavska","Dubrovačko-neretvanska","Grad Zagreb","Istarska","Karlovačka","Koprivničko-križevačka","Krapinsko-zagorska","Ličko-senjska","Međimurska","Osječko-baranjska","Požeško-slavonska","Primorsko-goranska","Sisačko-moslavačka","Splitsko-dalmatinska","Šibensko-kninska","Varaždinska","Virovitičko-podravska","Vukovarsko-srijemska","Zadarska"],
  ba:["Unsko-sanski","Posavski","Tuzlanski","Zeničko-dobojski","Bosansko-podrinjski","Srednjobosanski","Hercegovačko-neretvanski","Zapadnohercegovački","Sarajevo","Kanton 10"],
  rs:["Beograd","Bor","Braničevo","Zaječar","Zapadna Bačka","Južna Bačka","Južni Banat","Zlatibor","Kolubara","Mačva","Moravica","Nišava","Pčinja","Pirot","Podunavlje","Pomoravlje","Raška","Rasina","Severna Bačka","Severni Banat","Srednji Banat","Srem","Šumadija","Toplica"]
};

function escHtml(t){return String(t).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]);});}

function chatCard(c){
  var cls=c.own?'own':'other';
  return '<div class="chat-card '+cls+'"><div class="who">'+escHtml(c.who)+' <span>'+escHtml(c.region||c.city||'')+' · '+escHtml(c.time||'')+'</span></div><div class="msg">'+escHtml(c.body)+'</div></div>';
}

let myNick = null;

async function render(){
  var wrap=document.getElementById('chatWrap');
  wrap.innerHTML='<div class="empty">Učitavam...</div>';

  var fc=document.getElementById('countyFilter').value;
  try {
    var data = await api('GET', '/country-chat?country=' + COUNTRY + '&limit=100');
    var msgs = data.messages.map(function(m){
      return {
        who: m.who, city: m.city, region: m.region,
        body: m.body,
        time: new Date(m.created_at).getHours().toString().padStart(2,'0') + ':' + new Date(m.created_at).getMinutes().toString().padStart(2,'0'),
        own: myNick && m.who === myNick,
      };
    });
    if (fc !== 'SVI') msgs = msgs.filter(function(c){ return c.region === fc; });

    wrap.innerHTML = msgs.length ? msgs.map(chatCard).join('') : '<div class="empty">Nema poruka</div>';
    wrap.scrollTop = wrap.scrollHeight;
    var label = COUNTY==='SVI' ? countryNames[COUNTRY] : COUNTY;
    document.getElementById('currentFilter').textContent = label + ' — ' + msgs.length + ' poruka';
  } catch (e) {
    wrap.innerHTML = '<div class="empty">Greška pri učitavanju (jeste li prijavljeni?)</div>';
  }
}

var countySelect=document.getElementById('countyFilter');
(counties[COUNTRY]||[]).forEach(function(c){
  var opt=document.createElement('option');
  opt.value=c;opt.textContent=c;
  countySelect.appendChild(opt);
});
if(COUNTY!=='SVI')countySelect.value=COUNTY;

document.getElementById('chatSendBtn').addEventListener('click',async function(){
  var inp=document.getElementById('chatInput');
  var txt=inp.value.trim();
  if(!txt)return;
  try {
    await api('POST', '/country-chat', { country: COUNTRY, body: txt });
    inp.value='';
    render();
  } catch(e) { alert('❌ ' + e.message); }
});
document.getElementById('chatInput').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('chatSendBtn').click();});
document.getElementById('countyFilter').addEventListener('change',render);

document.getElementById('pageTitle').textContent='CHAT — '+countryNames[COUNTRY];
document.getElementById('pageSub').textContent=COUNTY==='SVI'?'Svi razgovori':COUNTY;
document.getElementById('backBtn').href=countryPage[COUNTRY]||'hrvatska.html';
document.getElementById('navOnline').href='na-mrezi.html?country='+COUNTRY+'&county='+COUNTY;
document.getElementById('navUsers').href='svi-korisnici.html?country='+COUNTRY+'&county='+COUNTY;
document.title='EX YU DATE — Chat — '+countryNames[COUNTRY];

(async function(){
  try { var me = await api('GET', '/auth/me'); if (me.loggedIn) myNick = me.nick; } catch(e){}
  render();
})();
</script>

</body>
</html>
